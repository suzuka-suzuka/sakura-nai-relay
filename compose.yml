services:
  relay:
    build: .
    init: true
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:3100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - relay-data:/app/data
    restart: unless-stopped
    stop_grace_period: 150s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  relay-data:

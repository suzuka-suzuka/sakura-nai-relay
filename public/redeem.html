<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eeee"><meta name="description" content="用兑换码领取 Sakura Relay 访问密钥"><title>兑换访问密钥 · Sakura Relay</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/redeem.js" defer></script></head><body><main class="redeem-page"><a class="brand" href="/redeem"><img src="/favicon.svg" alt="" class="flower"><span>Sakura <b>Relay</b></span></a><section class="redeem-card panel"><p class="eyebrow">兑换码</p><h1>兑换访问密钥</h1><p class="muted">把收到的兑换码贴到这里。提交后才会生成密钥，每枚兑换码只能兑换一次。</p><form id="redeem-form"><label>兑换码<input name="code" required maxlength="40" autocomplete="off" spellcheck="false" placeholder="CDK-XXXX-XXXX-XXXX" autofocus></label><div class="form-error" role="alert"></div><button class="button primary full" type="submit">兑换</button></form><section id="redeem-result" hidden></section></section></main></body></html>
